<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <!-- FM DICTIONARY ILLUSTRATION: Blueprint Scanner (ill_empty_search.svg) -->
  <!-- Tactile Neo-Bento Standard: Clean Minimal Flat, 2.0px / 1.5px strokes, AppColors mapping -->

  <!-- ========================================== -->
  <!-- 2. ARCHITECTURAL CAD SCHEMATIC WIREFRAME   -->
  <!-- ========================================== -->
  <!-- Flat Shadow (Fully rounded board pod) -->
  <rect x="42" y="36" width="130" height="108" rx="16" fill="#E2E8F0"/>

  <!-- CAD Drawing Board Background Fill -->
  <rect x="38" y="32" width="130" height="108" rx="16" fill="#F1F5F9"/>

  <!-- Interior Technical Drafting Grid (Recessed inside board margins) -->
  <line x1="44" y1="66" x2="162" y2="66" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="44" y1="100" x2="162" y2="100" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="82" y1="38" x2="82" y2="134" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="124" y1="38" x2="124" y2="134" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Facility Room Layout Wireframes -->
  <rect x="48" y="42" width="50" height="42" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="106" y="42" width="52" height="42" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="48" y="90" width="70" height="38" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="124" y="90" width="34" height="38" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>

  <!-- Technical Dimension Lines & Crosshairs -->
  <line x1="48" y1="38" x2="98" y2="38" stroke="#94A3B8" stroke-width="1"/>
  <line x1="73" y1="58" x2="73" y2="68" stroke="#94A3B8" stroke-width="1"/>

  <!-- CAD Drawing Board Crisp Outer Stroke (Renders ON TOP of interior grid) -->
  <rect x="38" y="32" width="130" height="108" rx="16" fill="none" stroke="#0F172A" stroke-width="2"/>

  <!-- ========================================== -->
  <!-- 3. FOREGROUND: FM BLUEPRINT SCANNER LENS   -->
  <!-- ========================================== -->
  <g id="scanner-lens">
    <!-- Scanner Handle (45-degree angle) -->
    <rect x="156" y="112" width="14" height="36" rx="7" transform="rotate(-45 156 112)" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
    <circle cx="186" cy="142" r="3" fill="#4A90E2"/>

    <!-- Lens Glass Frame Shadow -->
    <circle cx="132" cy="88" r="38" fill="#334155" opacity="0.12"/>

    <!-- Main Outer Lens Frame White Background -->
    <circle cx="128" cy="84" r="38" fill="#FFFFFF"/>

    <!-- Inner Blueprint Scanner Glass (Primary Blue Tint) -->
    <circle cx="128" cy="84" r="32" fill="#EFF6FF" stroke="#4A90E2" stroke-width="1.8"/>

    <!-- Scanner Reticle / Crosshair Target -->
    <line x1="128" y1="60" x2="128" y2="108" stroke="#4A90E2" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="104" y1="84" x2="152" y2="84" stroke="#4A90E2" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="128" cy="84" r="8" fill="none" stroke="#4A90E2" stroke-width="1.5"/>

    <!-- Central Null/Empty Query Symbol (No result found) -->
    <circle cx="128" cy="84" r="3" fill="#FF6B81"/>
    <!-- Concentric radar scan wave -->
    <circle cx="128" cy="84" r="22" fill="none" stroke="#4A90E2" stroke-width="1" opacity="0.4"/>

    <!-- Main Outer Lens Frame Stroke (Crisp on top) -->
    <circle cx="128" cy="84" r="38" fill="none" stroke="#0F172A" stroke-width="2"/>
  </g>
</svg>
