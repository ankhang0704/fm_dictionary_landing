<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <!-- FM DICTIONARY ILLUSTRATION: Maintenance Required / Review (ill_test_failed.svg) -->
  <!-- Tactile Neo-Bento Standard: Clean Minimal Flat, 2.0px / 1.5px strokes, AppColors mapping -->

  <!-- ========================================== -->
  <!-- 2. MAINTENANCE AUDIT LOG / CLIPBOARD       -->
  <!-- ========================================== -->
  <!-- Hard Flat Shadow -->
  <rect x="64" y="32" width="112" height="122" rx="16" fill="#E2E8F0"/>

  <!-- Main Report Body (Fully rounded pod) -->
  <rect x="60" y="28" width="112" height="122" rx="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>

  <!-- Top Grip Clip -->
  <rect x="96" y="20" width="40" height="16" rx="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.8"/>
  <rect x="108" y="25" width="16" height="6" rx="3" fill="#0F172A"/>

  <!-- Inspection Checklist Rows (Items needing attention) -->
  <!-- Row 1: Passed -->
  <g id="row-1">
    <circle cx="82" cy="54" r="7" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.4"/>
    <path d="M 79 54 L 81 56 L 86 51" fill="none" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="96" y="51" width="56" height="6" rx="3" fill="#CBD5E1"/>
  </g>

  <!-- Row 2: Flagged Maintenance Item (Review Pink Accent) -->
  <g id="row-2">
    <circle cx="82" cy="72" r="7" fill="#FF6B81" stroke="#0F172A" stroke-width="1.4"/>
    <line x1="82" y1="69" x2="82" y2="73" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="82" cy="75" r="0.8" fill="#FFFFFF"/>
    <rect x="96" y="69" width="48" height="6" rx="3" fill="#FFE4E6"/>
  </g>

  <!-- Row 3: Passed -->
  <g id="row-3">
    <circle cx="82" cy="90" r="7" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.4"/>
    <path d="M 79 90 L 81 92 L 86 87" fill="none" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="96" y="87" width="52" height="6" rx="3" fill="#CBD5E1"/>
  </g>

  <!-- Row 4: Flagged Maintenance Item (Streak Yellow / Review Accent) -->
  <g id="row-4">
    <circle cx="82" cy="108" r="7" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.4"/>
    <line x1="82" y1="105" x2="82" y2="109" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="82" cy="111" r="0.8" fill="#0F172A"/>
    <rect x="96" y="105" width="40" height="6" rx="3" fill="#FEF3C7"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. FOREGROUND: FM MAINTENANCE WRENCH TOOL  -->
  <!-- ========================================== -->
  <g id="maintenance-wrench">
    <!-- Wrench Shadow -->
    <path d="M 152 70 L 182 100 C 185 103 185 109 182 112 L 176 118 C 173 121 167 121 164 118 L 134 88" fill="#334155" opacity="0.12"/>
    <!-- Technical Wrench Body (Streak Yellow / Slate Steel) -->
    <rect x="148" y="92" width="12" height="46" rx="6" transform="rotate(-45 148 92)" fill="#F1F5F9" stroke="#0F172A" stroke-width="2"/>
    <circle cx="178" cy="122" r="3" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.2"/>
    <!-- Open Jaw Wrench Head -->
    <path d="M 134 80 C 132 74 136 66 142 64 C 145 63 149 64 151 66 L 145 72 L 149 76 L 155 70 C 157 72 158 76 157 79 C 155 85 147 89 141 87 Z" fill="#F1F5F9" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Re-calibration Loop Icon (Review Pink Accent Badge) -->
  <g id="review-pill">
    <rect x="36" y="68" width="22" height="36" rx="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/>
    <path d="M 47 76 A 5 5 0 1 1 43 83" fill="none" stroke="#FF6B81" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 43 80 L 43 84 L 47 84" fill="none" stroke="#FF6B81" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
