<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <!-- FM DICTIONARY ILLUSTRATION: Engineer ID & Invite Key (ill_group_invite.svg) -->
  <!-- Tactile Neo-Bento Standard: 2.0px / 1.5px strokes, Clean Minimal Flat, AppColors -->

  <!-- ========================================== -->
  <!-- 1. BASE GROUND SHADOW                      -->
  <!-- ========================================== -->
  <rect x="42" y="146" width="156" height="12" rx="6" fill="#E2E8F0"/>

  <!-- ========================================== -->
  <!-- 2. FACILITY ENGINEER ID BADGE (Left/Center) -->
  <!-- ========================================== -->
  <!-- Lanyard Neck Clip Slot -->
  <rect x="74" y="22" width="28" height="6" rx="3" fill="#94A3B8"/>
  <rect x="78" y="28" width="20" height="10" rx="3" fill="#CBD5E1" stroke="#0F172A" stroke-width="1.8"/>

  <!-- ID Badge Body Card -->
  <rect x="48" y="34" width="80" height="114" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>

  <!-- Top Brand Strip (Electric Blue) -->
  <path d="M 48 46 C 48 39.4 53.4 34 60 34 L 116 34 C 122.6 34 128 39.4 128 46 L 128 54 L 48 54 Z" fill="#2563EB"/>
  <circle cx="62" cy="44" r="3" fill="#FFFFFF"/>
  <rect x="70" y="42" width="38" height="4" rx="2" fill="#93C5FD"/>

  <!-- Photo / Avatar Silhouette -->
  <rect x="68" y="64" width="40" height="38" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.4"/>
  <circle cx="88" cy="76" r="8" fill="#CBD5E1"/>
  <path d="M 76 96 C 76 89 81 87 88 87 C 95 87 100 89 100 96 Z" fill="#94A3B8"/>

  <!-- Engineer Name & Title Bar -->
  <rect x="62" y="110" width="52" height="6" rx="3" fill="#0F172A"/>
  <rect x="66" y="122" width="44" height="4" rx="2" fill="#64748B"/>
  <rect x="72" y="132" width="32" height="4" rx="2" fill="#CBD5E1"/>

  <!-- ========================================== -->
  <!-- 3. CONNECTING DATA PULSE BRIDGE           -->
  <!-- ========================================== -->
  <path d="M 128 92 C 144 80 152 80 166 90" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="147" cy="84" r="3.5" fill="#2563EB"/>

  <!-- ========================================== -->
  <!-- 4. FLOATING ACCESS KEY (Right)             -->
  <!-- ========================================== -->
  <!-- Key Floating Shadow -->
  <ellipse cx="178" cy="116" rx="28" ry="8" fill="#CBD5E1" opacity="0.6"/>

  <g id="access-key" transform="rotate(-15 174 92)">
    <!-- Key Head (Rounded Hexagon) -->
    <circle cx="160" cy="92" r="18" fill="#FEF3C7" stroke="#0F172A" stroke-width="2"/>
    <circle cx="160" cy="92" r="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>

    <!-- Key Shaft -->
    <rect x="176" y="88" width="32" height="8" rx="2" fill="#F59E0B" stroke="#0F172A" stroke-width="2"/>

    <!-- Key Teeth (Bespoke Cutouts) -->
    <rect x="194" y="96" width="5" height="8" rx="1.5" fill="#F59E0B" stroke="#0F172A" stroke-width="1.8"/>
    <rect x="202" y="96" width="5" height="12" rx="1.5" fill="#F59E0B" stroke="#0F172A" stroke-width="1.8"/>
  </g>

  <!-- Sparkle Stars for Excitement -->
  <path d="M 198 42 L 200 48 L 206 50 L 200 52 L 198 58 L 196 52 L 190 50 L 196 48 Z" fill="#F59E0B"/>
  <circle cx="140" cy="46" r="2.5" fill="#2563EB"/>
  <circle cx="214" cy="74" r="2" fill="#F59E0B"/>
</svg>
