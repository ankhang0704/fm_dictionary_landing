<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <!-- FM DICTIONARY ILLUSTRATION: Facility Operations & Technical Vocabulary (ill_onboarding_welcome.svg) -->
  <!-- Tactile Neo-Bento Standard: Clean Minimal Flat, 2.0px / 1.5px strokes, AppColors mapping -->

  <!-- ========================================== -->
  <!-- 1. BACKGROUND: SMART ARCHITECTURAL TOWER   -->
  <!-- ========================================== -->
  <g id="smart-facility-tower">
    <!-- Facility Tower Base Flat Shadow -->
    <rect x="42" y="32" width="76" height="104" rx="14" fill="#E2E8F0"/>
    
    <!-- Facility Tower Main Structure -->
    <rect x="38" y="28" width="76" height="104" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.0"/>

    <!-- Rooftop Chiller / Solar Array -->
    <rect x="48" y="18" width="34" height="10" rx="3" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.6"/>
    <line x1="58" y1="18" x2="58" y2="28" stroke="#0F172A" stroke-width="1.4"/>
    <line x1="68" y1="18" x2="68" y2="28" stroke="#0F172A" stroke-width="1.4"/>
    <!-- Sensor Beacon Antenna -->
    <line x1="94" y1="28" x2="94" y2="14" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="94" cy="11" r="3.5" fill="#4A90E2" stroke="#0F172A" stroke-width="1.4"/>

    <!-- Architectural Window Matrix (Smart Lit Grid) -->
    <rect x="48" y="38" width="14" height="12" rx="3" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.2"/>
    <rect x="68" y="38" width="14" height="12" rx="3" fill="#4A90E2" stroke="#0F172A" stroke-width="1.2"/>
    <rect x="88" y="38" width="14" height="12" rx="3" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.2"/>

    <rect x="48" y="56" width="14" height="12" rx="3" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.2"/>
    <rect x="68" y="56" width="14" height="12" rx="3" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.2"/>
    <rect x="88" y="56" width="14" height="12" rx="3" fill="#4A90E2" stroke="#0F172A" stroke-width="1.2"/>

    <rect x="48" y="74" width="14" height="12" rx="3" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.2"/>
    <rect x="68" y="74" width="14" height="12" rx="3" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.2"/>
    <rect x="88" y="74" width="14" height="12" rx="3" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.2"/>

    <!-- HVAC Ducting Conduit Tube -->
    <path d="M 106 94 L 122 94 C 126 94 128 96 128 100 L 128 116" stroke="#4A90E2" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ========================================== -->
  <!-- 2. CENTER: OPEN FM VOCABULARY DICTIONARY   -->
  <!-- ========================================== -->
  <g id="open-vocabulary-handbook">
    <!-- Book Shadow -->
    <path d="M 102 68 L 210 68 C 216 68 220 72 220 78 L 220 148 C 220 154 216 158 210 158 L 102 158 Z" fill="#CBD5E1"/>

    <!-- Book Base / Cover (Deep Navy FM Handbook) -->
    <rect x="98" y="64" width="118" height="90" rx="14" fill="#0F172A"/>

    <!-- Left Page Block -->
    <path d="M 102 68 Q 130 66 154 72 L 154 146 Q 130 142 102 144 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.8"/>
    <!-- Right Page Block -->
    <path d="M 154 72 Q 178 66 210 68 L 210 144 Q 178 142 154 146 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/>

    <!-- Book Spine Crease & Gold Ribbon Bookmark -->
    <line x1="154" y1="70" x2="154" y2="148" stroke="#0F172A" stroke-width="1.6"/>
    <path d="M 152 70 L 152 136 L 157 131 L 162 136 L 162 70 Z" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.2"/>

    <!-- Left Page Content: FM Term Card -->
    <!-- Term Header Pill "HVAC" -->
    <rect x="108" y="78" width="36" height="12" rx="4" fill="#4A90E2"/>
    <text x="126" y="87" font-family="OpenSans, sans-serif" font-size="7.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">HVAC</text>

    <!-- Pronunciation Speaker Icon -->
    <circle cx="114" cy="100" r="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.2"/>
    <path d="M 112 100 L 115 98 L 115 102 Z" fill="#4A90E2"/>
    <path d="M 116 99 C 117 99.5 117 100.5 116 101" stroke="#4A90E2" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- Phonetic Line -->
    <line x1="124" y1="100" x2="144" y2="100" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Technical Definition Lines -->
    <line x1="108" y1="112" x2="146" y2="112" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="108" y1="120" x2="140" y2="120" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="108" y1="128" x2="134" y2="128" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Right Page Content: Interactive Mastery Flashcard -->
    <rect x="162" y="78" width="42" height="54" rx="8" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.4"/>
    <!-- Flashcard Header Bar -->
    <rect x="162" y="78" width="42" height="12" rx="6" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.4"/>
    <circle cx="170" cy="84" r="2" fill="#0F172A"/>
    <circle cx="176" cy="84" r="2" fill="#0F172A"/>

    <!-- Flashcard Diagram / Chiller Unit -->
    <rect x="170" y="96" width="26" height="16" rx="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/>
    <circle cx="177" cy="104" r="3.5" fill="#4A90E2"/>
    <line x1="184" y1="102" x2="192" y2="102" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="184" y1="106" x2="190" y2="106" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Mastery Check Seal -->
    <circle cx="183" cy="124" r="4.5" fill="#4A90E2" stroke="#0F172A" stroke-width="1.2"/>
    <path d="M 181 124 L 182.5 125.5 L 185.5 122.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. FOREGROUND: SAFETY HARDHAT & BADGE      -->
  <!-- ========================================== -->
  <g id="safety-hardhat-crest">
    <!-- Hardhat Shadow -->
    <ellipse cx="48" cy="149" rx="24" ry="7" fill="#CBD5E1"/>

    <!-- Hardhat Outer Brim -->
    <path d="M 24 145 C 24 144 32 143 48 143 C 64 143 72 144 72 145 C 72 148 64 150 48 150 C 32 150 24 148 24 145 Z" fill="#FDCB6E" stroke="#0F172A" stroke-width="2.0"/>

    <!-- Hardhat Dome Structure -->
    <path d="M 28 143 C 28 126 36 120 48 120 C 60 120 68 126 68 143 Z" fill="#FDCB6E" stroke="#0F172A" stroke-width="2.0"/>

    <!-- Hardhat Center Reinforcing Ridge -->
    <path d="M 45 120 C 45 124 45 138 45 143 L 51 143 C 51 138 51 124 51 120 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.4"/>

    <!-- FM Engineering Emblem Shield -->
    <rect x="42" y="130" width="12" height="9" rx="2.5" fill="#0F172A"/>
    <text x="48" y="137" font-family="OpenSans, sans-serif" font-size="5.5" font-weight="900" fill="#FDCB6E" text-anchor="middle">FM</text>
  </g>

  <!-- Floating Technical Sparks / Coordinate Crosses -->
  <g id="blueprint-sparks" stroke="#0F172A" stroke-width="1.4" stroke-linecap="round">
    <line x1="20" y1="65" x2="26" y2="65"/>
    <line x1="23" y1="62" x2="23" y2="68"/>

    <circle cx="218" cy="46" r="3" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.2"/>

    <line x1="126" y1="22" x2="132" y2="22"/>
    <line x1="129" y1="19" x2="129" y2="25"/>
  </g>
</svg>
