<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <!-- FM DICTIONARY ILLUSTRATION: Day/Night Facility (ill_onboarding_theme.svg) -->
  <!-- Tactile Neo-Bento Standard: Clean Minimal Flat, 2.0px / 1.5px strokes, AppColors mapping -->

  <!-- ========================================== -->
  <!-- 2. SPLIT BUILDING SILHOUETTE (DAY / NIGHT) -->
  <!-- ========================================== -->
  <!-- Flat Shadow Under Structure (Fully rounded pod) -->
  <rect x="54" y="32" width="132" height="124" rx="16" fill="#E2E8F0"/>

  <!-- LEFT HALF: DAY MODE FACILITY (Light Slate & Streak Yellow) -->
  <path d="M 50 44 C 50 35.16 57.16 28 66 28 L 120 28 L 120 152 L 66 152 C 57.16 152 50 144.84 50 136 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>

  <!-- RIGHT HALF: NIGHT MODE FACILITY (Midnight Slate & Primary Blue) -->
  <path d="M 120 28 L 174 28 C 182.84 28 190 35.16 190 44 L 190 136 C 190 144.84 182.84 152 174 152 L 120 152 Z" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>

  <!-- Center Split Datum Axis Line -->
  <line x1="120" y1="20" x2="120" y2="160" stroke="#0F172A" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- ========================================== -->
  <!-- 3. ARCHITECTURAL WINDOWS & MEP SENSORS     -->
  <!-- ========================================== -->
  <!-- Day Mode Windows (Left side: Clear Sunlit Glass) -->
  <rect x="66" y="44" width="18" height="18" rx="4" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.4"/>
  <rect x="92" y="44" width="18" height="18" rx="4" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.4"/>
  <rect x="66" y="72" width="18" height="18" rx="4" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.4"/>
  <rect x="92" y="72" width="18" height="18" rx="4" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.4"/> <!-- Lighted Office -->
  <rect x="66" y="100" width="18" height="18" rx="4" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.4"/>
  <rect x="92" y="100" width="18" height="18" rx="4" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.4"/>
  <rect x="74" y="126" width="28" height="20" rx="5" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.4"/>

  <!-- Night Mode Windows (Right side: Active Night Operations) -->
  <rect x="130" y="44" width="18" height="18" rx="4" fill="#4A90E2" stroke="#0F172A" stroke-width="1.4"/> <!-- Glowing Blue Sensor -->
  <rect x="156" y="44" width="18" height="18" rx="4" fill="#334155" stroke="#0F172A" stroke-width="1.4"/>
  <rect x="130" y="72" width="18" height="18" rx="4" fill="#334155" stroke="#0F172A" stroke-width="1.4"/>
  <rect x="156" y="72" width="18" height="18" rx="4" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.4"/> <!-- Control Room -->
  <rect x="130" y="100" width="18" height="18" rx="4" fill="#334155" stroke="#0F172A" stroke-width="1.4"/>
  <rect x="156" y="100" width="18" height="18" rx="4" fill="#4A90E2" stroke="#0F172A" stroke-width="1.4"/>
  <rect x="138" y="126" width="28" height="20" rx="5" fill="#334155" stroke="#0F172A" stroke-width="1.4"/>

  <!-- ========================================== -->
  <!-- 4. CELESTIAL & OPERATIONAL METAPHORS       -->
  <!-- ========================================== -->
  <!-- Day Sun: Streak Yellow Accent (Top Left) -->
  <g id="day-sun">
    <circle cx="44" cy="38" r="14" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.8"/>
    <!-- Sun Ray Accents -->
    <line x1="44" y1="18" x2="44" y2="21" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="24" y1="38" x2="27" y2="38" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="30" y1="24" x2="32" y2="26" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="30" y1="52" x2="32" y2="50" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Night Moon: Clean Geometric Crescent Moon (Top Right) -->
  <g id="night-moon">
    <!-- Dark Sky Circle Base with crisp stroke -->
    <circle cx="196" cy="38" r="14" fill="#1E293B" stroke="#0F172A" stroke-width="1.8"/>
    <!-- Elegant Crescent Moon (Primary Blue #4A90E2 with clean arc geometry) -->
    <path d="M 196 26 A 12 12 0 1 1 184 38 A 12 12 0 0 0 196 26 Z" fill="#4A90E2"/>
    <!-- Outer rim preservation stroke -->
    <circle cx="196" cy="38" r="14" fill="none" stroke="#0F172A" stroke-width="1.8"/>
    <!-- Mini Star Nodes -->
    <circle cx="214" cy="28" r="2" fill="#FDCB6E"/>
    <circle cx="218" cy="44" r="1.5" fill="#4A90E2"/>
  </g>
</svg>
