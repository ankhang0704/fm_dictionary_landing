<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <!-- FM DICTIONARY ILLUSTRATION: FM Facility Commissioning / Verified Operations Success (ill_status_success.svg) -->
  <!-- Tactile Neo-Bento Standard: Clean Minimal Flat, 0-blur hard shadows, #0F172A contours, AppColors tokens -->
  <!-- Specification Reference: docs/design/ILLUSTRATION_SPEC_FORMULA.md (viewBox="0 0 800 600") -->

  <!-- ======================================================== -->
  <!-- 1. BACKGROUND GEOMETRIC ELEMENTS & BLUEPRINT GRID        -->
  <!-- ======================================================== -->
  <!-- Floor Contact Flat Shadow -->
  <ellipse cx="400" cy="535" rx="320" ry="22" fill="#E2E8F0"/>

  <!-- Blueprint Datum Coordinate Grid Lines -->
  <g stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <line x1="120" y1="120" x2="120" y2="480" stroke-dasharray="8 8"/>
    <line x1="680" y1="120" x2="680" y2="480" stroke-dasharray="8 8"/>
    <line x1="80" y1="300" x2="720" y2="300" stroke-dasharray="8 8"/>
  </g>

  <!-- Technical Alignment Datum Crosshairs -->
  <g stroke="#0F172A" stroke-width="3" stroke-linecap="round">
    <line x1="110" y1="90" x2="130" y2="90"/>
    <line x1="120" y1="80" x2="120" y2="100"/>
    <line x1="670" y1="90" x2="690" y2="90"/>
    <line x1="680" y1="80" x2="680" y2="100"/>
  </g>
  <circle cx="100" cy="220" r="8" fill="#FDCB6E" stroke="#0F172A" stroke-width="3"/>
  <circle cx="700" cy="240" r="8" fill="#4A90E2" stroke="#0F172A" stroke-width="3"/>

  <!-- ======================================================== -->
  <!-- 2. ARCHITECTURAL CAMPUS WINGS (FM FACILITY TOWERS)       -->
  <!-- ======================================================== -->
  <!-- Left Facility Wing: MEP & HVAC Engineering Unit -->
  <!-- Flat Shadow -->
  <rect x="136" y="216" width="130" height="300" rx="16" fill="#CBD5E1"/>
  <!-- Building Body -->
  <rect x="130" y="210" width="130" height="300" rx="16" fill="#F8FAFC" stroke="#0F172A" stroke-width="4"/>
  <!-- Rooftop HVAC Mechanical Fan Unit -->
  <rect x="155" y="176" width="80" height="34" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.5"/>
  <circle cx="195" cy="193" r="11" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5"/>
  <line x1="195" y1="184" x2="195" y2="202" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
  <line x1="186" y1="193" x2="204" y2="193" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Tower Window Pods (Bento Architectural Grid) -->
  <g fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5">
    <rect x="150" y="235" width="38" height="26" rx="4"/>
    <rect x="202" y="235" width="38" height="26" rx="4" fill="#ECFDF5"/>
    <rect x="150" y="275" width="38" height="26" rx="4"/>
    <rect x="202" y="275" width="38" height="26" rx="4"/>
    <rect x="150" y="315" width="38" height="26" rx="4" fill="#ECFDF5"/>
    <rect x="202" y="315" width="38" height="26" rx="4"/>
  </g>

  <!-- Right Facility Wing: Smart Sensor & Telemetry Tower -->
  <!-- Flat Shadow -->
  <rect x="546" y="186" width="130" height="330" rx="16" fill="#CBD5E1"/>
  <!-- Building Body -->
  <rect x="540" y="180" width="130" height="330" rx="16" fill="#F8FAFC" stroke="#0F172A" stroke-width="4"/>

  <!-- Rooftop Antenna & Signal Beacon -->
  <line x1="605" y1="180" x2="605" y2="120" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="605" cy="114" r="8" fill="#50E3C2" stroke="#0F172A" stroke-width="3"/>
  <!-- Telemetry Emission Waves -->
  <path d="M 585 110 A 24 24 0 0 1 625 110" stroke="#4A90E2" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 573 98 A 40 40 0 0 1 637 98" stroke="#4A90E2" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Right Tower Solar Array Matrix -->
  <rect x="558" y="210" width="94" height="64" rx="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="2.5"/>
  <line x1="558" y1="231" x2="652" y2="231" stroke="#0F172A" stroke-width="2"/>
  <line x1="558" y1="252" x2="652" y2="252" stroke="#0F172A" stroke-width="2"/>
  <line x1="589" y1="210" x2="589" y2="274" stroke="#0F172A" stroke-width="2"/>
  <line x1="620" y1="210" x2="620" y2="274" stroke="#0F172A" stroke-width="2"/>

  <!-- Right Tower Lower Window Pods -->
  <g fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5">
    <rect x="558" y="295" width="38" height="26" rx="4"/>
    <rect x="614" y="295" width="38" height="26" rx="4" fill="#ECFDF5"/>
  </g>

  <!-- ======================================================== -->
  <!-- 3. CENTRAL COMMISSIONING TABLET & PEDESTAL               -->
  <!-- ======================================================== -->
  <!-- Pedestal Platform Base -->
  <rect x="250" y="490" width="300" height="28" rx="12" fill="#E2E8F0" stroke="#0F172A" stroke-width="4"/>

  <!-- Console / Clipboard Flat Shadow -->
  <rect x="252" y="88" width="300" height="400" rx="22" fill="#CBD5E1"/>
  <!-- Main Tablet Body -->
  <rect x="240" y="78" width="300" height="400" rx="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="5"/>

  <!-- Top Clipboard Grip Clip -->
  <rect x="330" y="58" width="120" height="38" rx="8" fill="#F1F5F9" stroke="#0F172A" stroke-width="4"/>
  <rect x="372" y="66" width="36" height="8" rx="4" fill="#0F172A"/>

  <!-- Tablet Top Header Divider -->
  <line x1="243" y1="126" x2="537" y2="126" stroke="#0F172A" stroke-width="3.5"/>
  <!-- Status Indication Lights -->
  <circle cx="270" cy="104" r="6" fill="#50E3C2" stroke="#0F172A" stroke-width="2"/>
  <circle cx="290" cy="104" r="6" fill="#FDCB6E" stroke="#0F172A" stroke-width="2"/>
  <circle cx="310" cy="104" r="6" fill="#4A90E2" stroke="#0F172A" stroke-width="2"/>

  <!-- Header Text Trace Bar -->
  <rect x="430" y="96" width="86" height="16" rx="5" fill="#F1F5F9" stroke="#0F172A" stroke-width="2"/>

  <!-- Inspection Checklist Rows (Technical Compliance Verified) -->
  <!-- Row 1: Structural & Architectural Status Passed -->
  <g id="check-row-1">
    <rect x="268" y="146" width="244" height="28" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
    <circle cx="286" cy="160" r="8" fill="#50E3C2" stroke="#0F172A" stroke-width="2"/>
    <path d="M 282 160 L 285 163 L 291 157" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="304" y1="160" x2="490" y2="160" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Row 2: HVAC & Environmental Quality Certified -->
  <g id="check-row-2">
    <rect x="268" y="184" width="244" height="28" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
    <circle cx="286" cy="198" r="8" fill="#50E3C2" stroke="#0F172A" stroke-width="2"/>
    <path d="M 282 198 L 285 201 L 291 195" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="304" y1="198" x2="456" y2="198" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Row 3: Electrical & Fire Safety Passed -->
  <g id="check-row-3">
    <rect x="268" y="222" width="244" height="28" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
    <circle cx="286" cy="236" r="8" fill="#50E3C2" stroke="#0F172A" stroke-width="2"/>
    <path d="M 282 236 L 285 239 L 291 233" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="304" y1="236" x2="472" y2="236" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ======================================================== -->
  <!-- 4. GRAND VERIFIED COMMISSIONING SEAL (TACTILE CHECKMARK)  -->
  <!-- ======================================================== -->
  <!-- Hard Flat Seal Shadow -->
  <circle cx="408" cy="358" r="88" fill="#CBD5E1"/>

  <!-- Outer White Frame Ring -->
  <circle cx="400" cy="350" r="88" fill="#FFFFFF" stroke="#0F172A" stroke-width="5"/>

  <!-- Mastery Mint Verified Disc -->
  <circle cx="400" cy="350" r="74" fill="#50E3C2" stroke="#0F172A" stroke-width="4.5"/>

  <!-- Inner Concentric Tone Highlight -->
  <circle cx="400" cy="350" r="62" fill="#ECFDF5" stroke="#0F172A" stroke-width="2"/>

  <!-- Precision High-Tactile Checkmark -->
  <path d="M 368 350 L 392 374 L 442 322" fill="none" stroke="#0F172A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ======================================================== -->
  <!-- 5. VERIFIED FM RIBBON TAILS & BANNER                     -->
  <!-- ======================================================== -->
  <!-- Left Ribbon Tail -->
  <path d="M 346 414 L 306 454 L 334 454 L 354 434 Z" fill="#FDCB6E" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Right Ribbon Tail -->
  <path d="M 454 414 L 494 454 L 466 454 L 446 434 Z" fill="#FDCB6E" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Center Gold Milestone Banner Plaque -->
  <rect x="330" y="416" width="140" height="28" rx="8" fill="#FDCB6E" stroke="#0F172A" stroke-width="3.5"/>
  <line x1="352" y1="430" x2="448" y2="430" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ======================================================== -->
  <!-- 6. TECHNICAL GAUGES & ACCENT MOTIFS                      -->
  <!-- ======================================================== -->
  <!-- Floating Precision Calibration Gauge on Lower Left -->
  <g id="calibration-gauge">
    <circle cx="212" cy="412" r="28" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.5"/>
    <path d="M 194 420 A 20 20 0 1 1 230 420" fill="none" stroke="#4A90E2" stroke-width="3.5"/>
    <line x1="212" y1="412" x2="224" y2="398" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="212" cy="412" r="4.5" fill="#0F172A"/>
  </g>

  <!-- Floating Mechanical Calibration Tool on Lower Right -->
  <g transform="translate(565, 385) rotate(-25)">
    <rect x="0" y="8" width="52" height="15" rx="4" fill="#CBD5E1" stroke="#0F172A" stroke-width="3"/>
    <circle cx="0" cy="15" r="16" fill="#F1F5F9" stroke="#0F172A" stroke-width="3"/>
    <rect x="-8" y="10" width="10" height="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <circle cx="36" cy="15" r="4" fill="#FDCB6E" stroke="#0F172A" stroke-width="2"/>
  </g>

  <!-- Geometric Memphis / Bento Accent Sparkles -->
  <!-- Left Star Sparkle -->
  <path d="M 280 270 L 284 282 L 296 286 L 284 290 L 280 302 L 276 290 L 264 286 L 276 282 Z" fill="#FDCB6E" stroke="#0F172A" stroke-width="2.5"/>
  <!-- Right Star Sparkle -->
  <path d="M 515 265 L 519 277 L 531 281 L 519 285 L 515 297 L 511 285 L 499 281 L 511 277 Z" fill="#50E3C2" stroke="#0F172A" stroke-width="2.5"/>
  <!-- Floating Dot Nodes -->
  <circle cx="270" cy="330" r="4" fill="#4A90E2"/>
  <circle cx="530" cy="330" r="4" fill="#FDCB6E"/>
</svg>
