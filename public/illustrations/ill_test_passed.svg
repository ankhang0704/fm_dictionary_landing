<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <!-- FM DICTIONARY ILLUSTRATION: Inspection Report Passed (ill_test_passed.svg) -->
  <!-- Tactile Neo-Bento Standard: Clean Minimal Flat, 2.0px / 1.5px strokes, AppColors mapping -->

  <!-- ========================================== -->
  <!-- 2. TECHNICAL COMPLIANCE REPORT / CLIPBOARD -->
  <!-- ========================================== -->
  <!-- Hard Flat Shadow -->
  <rect x="64" y="32" width="112" height="122" rx="16" fill="#E2E8F0"/>

  <!-- Main Report Body (Fully rounded pod) -->
  <rect x="60" y="28" width="112" height="122" rx="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>

  <!-- Top Grip Clip -->
  <rect x="96" y="20" width="40" height="16" rx="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.8"/>
  <rect x="108" y="25" width="16" height="6" rx="3" fill="#0F172A"/>

  <!-- Checklist Inspection Rows (Passed items) -->
  <!-- Row 1 -->
  <g id="row-1">
    <circle cx="82" cy="54" r="7" fill="#50E3C2" stroke="#0F172A" stroke-width="1.4"/>
    <path d="M 79 54 L 81 56 L 86 51" fill="none" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="96" y="51" width="56" height="6" rx="3" fill="#CBD5E1"/>
  </g>

  <!-- Row 2 -->
  <g id="row-2">
    <circle cx="82" cy="72" r="7" fill="#50E3C2" stroke="#0F172A" stroke-width="1.4"/>
    <path d="M 79 72 L 81 74 L 86 69" fill="none" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="96" y="69" width="46" height="6" rx="3" fill="#CBD5E1"/>
  </g>

  <!-- Row 3 -->
  <g id="row-3">
    <circle cx="82" cy="90" r="7" fill="#50E3C2" stroke="#0F172A" stroke-width="1.4"/>
    <path d="M 79 90 L 81 92 L 86 87" fill="none" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="96" y="87" width="52" height="6" rx="3" fill="#CBD5E1"/>
  </g>

  <!-- Row 4 -->
  <g id="row-4">
    <circle cx="82" cy="108" r="7" fill="#50E3C2" stroke="#0F172A" stroke-width="1.4"/>
    <path d="M 79 108 L 81 110 L 86 105" fill="none" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="96" y="105" width="40" height="6" rx="3" fill="#CBD5E1"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. FOREGROUND: 100% PASSED STAMP SEAL      -->
  <!-- ========================================== -->
  <g id="passed-stamp">
    <!-- Stamp Shadow -->
    <rect x="132" y="96" width="60" height="42" rx="10" transform="rotate(-10 132 96)" fill="#334155" opacity="0.12"/>
    <!-- Stamp Badge (Primary Blue Frame + Mastery Mint Inset) -->
    <rect x="130" y="92" width="60" height="42" rx="10" transform="rotate(-10 130 92)" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="134" y="96" width="52" height="34" rx="7" transform="rotate(-10 130 92)" fill="#ECFDF5" stroke="#50E3C2" stroke-width="1.6"/>
    
    <!-- Bold Passed Checkmark -->
    <path d="M 148 112 L 155 119 L 172 102" fill="none" stroke="#50E3C2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Technical Calibration Gauge on Left -->
  <g id="inspection-gauge">
    <circle cx="38" cy="78" r="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/>
    <path d="M 30 82 A 10 10 0 1 1 46 82" fill="none" stroke="#4A90E2" stroke-width="2"/>
    <line x1="38" y1="78" x2="43" y2="71" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
    <circle cx="38" cy="78" r="2.5" fill="#0F172A"/>
  </g>
</svg>
