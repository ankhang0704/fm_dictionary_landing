<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <!-- FM DICTIONARY ILLUSTRATION: Level A1 - FM Foundation (ill_level_a1.svg) -->
  <!-- Tactile Neo-Bento Standard: Clean Minimal Flat, 2.0px contour, AppColors mapping -->

  <!-- 1. BLUEPRINT BACKGROUND PLATE -->
  <rect x="46" y="22" width="154" height="142" rx="16" fill="#E2E8F0"/>
  <rect x="42" y="18" width="154" height="142" rx="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.0"/>

  <!-- Blueprint Coordinate Grid -->
  <line x1="56" y1="42" x2="182" y2="42" stroke="#0F172A" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="56" y1="134" x2="182" y2="134" stroke="#0F172A" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="68" y1="30" x2="68" y2="148" stroke="#0F172A" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="170" y1="30" x2="170" y2="148" stroke="#0F172A" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 4"/>

  <!-- Technical Corner Registration Marks -->
  <path d="M 50 26 L 56 26 M 50 26 L 50 32" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 188 26 L 182 26 M 188 26 L 188 32" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 2. FOUNDATION DRAFTING TOOLS (Triangle Ruler & Stylus) -->
  <!-- Drafting Set-Square Triangle (Slate Blue #64748B) -->
  <path d="M 62 122 L 108 52 L 126 122 Z" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 76 114 L 102 74 L 114 114 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Ruler Measurement Ticks -->
  <line x1="72" y1="122" x2="72" y2="117" stroke="#0F172A" stroke-width="1.0"/>
  <line x1="82" y1="122" x2="82" y2="119" stroke="#0F172A" stroke-width="1.0"/>
  <line x1="92" y1="122" x2="92" y2="117" stroke="#0F172A" stroke-width="1.0"/>
  <line x1="102" y1="122" x2="102" y2="119" stroke="#0F172A" stroke-width="1.0"/>
  <line x1="112" y1="122" x2="112" y2="117" stroke="#0F172A" stroke-width="1.0"/>

  <!-- Drafting Stylus / Technical Pencil -->
  <path d="M 168 56 L 178 66 L 142 108 L 132 98 Z" fill="#64748B" stroke="#0F172A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M 132 98 L 142 108 L 130 114 Z" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="130" cy="114" r="1.5" fill="#0F172A"/>

  <!-- 3. CENTRAL A1 FOUNDATION SEAL -->
  <!-- Outer Slate Medallion -->
  <circle cx="120" cy="84" r="34" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.0"/>
  <circle cx="120" cy="84" r="28" fill="#64748B" fill-opacity="0.12" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Center A1 Monogram Badge -->
  <rect x="104" y="68" width="32" height="32" rx="8" fill="#64748B" stroke="#0F172A" stroke-width="1.8"/>
  <!-- Vector Stylized 'A1' -->
  <path d="M 112 92 L 118 76 L 124 92 M 114 87 L 122 87" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 129 79 L 132 76 L 132 92 M 128 92 L 136 92" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Single Foundation Star -->
  <path d="M 120 54 L 122.5 59.5 L 128.5 60 L 124 64 L 125.5 70 L 120 66.5 L 114.5 70 L 116 64 L 111.5 60 L 117.5 59.5 Z" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- 4. LEVEL PROGRESS CALIBRATION POD (Node 1/6 Active) -->
  <rect x="74" y="136" width="92" height="16" rx="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.5"/>
  <circle cx="86" cy="144" r="3.5" fill="#64748B" stroke="#0F172A" stroke-width="1.0"/>
  <circle cx="100" cy="144" r="3.0" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.8"/>
  <circle cx="114" cy="144" r="3.0" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.8"/>
  <circle cx="126" cy="144" r="3.0" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.8"/>
  <circle cx="138" cy="144" r="3.0" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.8"/>
  <circle cx="152" cy="144" r="3.0" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.8"/>
