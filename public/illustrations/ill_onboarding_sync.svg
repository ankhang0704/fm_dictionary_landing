<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <!-- FM DICTIONARY ILLUSTRATION: Connected Infrastructure (ill_onboarding_sync.svg) -->
  <!-- Tactile Neo-Bento Standard: Clean Minimal Flat, 2.0px / 1.5px strokes, AppColors mapping -->

  <!-- ========================================== -->
  <!-- 2. CONNECTED SMART FACILITY TOWER (LEFT)   -->
  <!-- ========================================== -->
  <g id="smart-facility-tower">
    <!-- Flat Shadow (Fully rounded pod) -->
    <rect x="42" y="70" width="64" height="82" rx="14" fill="#E2E8F0"/>
    <!-- Tower Body (Fully enclosed pod) -->
    <rect x="38" y="66" width="64" height="82" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <!-- Central Server Rack / Window Modules -->
    <rect x="48" y="78" width="44" height="12" rx="3" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.2"/>
    <circle cx="56" cy="84" r="2" fill="#50E3C2"/>
    <line x1="64" y1="84" x2="84" y2="84" stroke="#CBD5E1" stroke-width="1.2"/>

    <rect x="48" y="96" width="44" height="12" rx="3" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.2"/>
    <circle cx="56" cy="102" r="2" fill="#4A90E2"/>
    <line x1="64" y1="102" x2="84" y2="102" stroke="#CBD5E1" stroke-width="1.2"/>

    <rect x="48" y="114" width="44" height="12" rx="3" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.2"/>
    <circle cx="56" cy="120" r="2" fill="#50E3C2"/>
    <line x1="64" y1="120" x2="84" y2="120" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Building Rooftop Antenna -->
    <line x1="70" y1="66" x2="70" y2="52" stroke="#0F172A" stroke-width="1.8"/>
    <circle cx="70" cy="50" r="3.5" fill="#4A90E2" stroke="#0F172A" stroke-width="1.4"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. MOBILE FM TERMINAL DEVICE (RIGHT)       -->
  <!-- ========================================== -->
  <g id="mobile-terminal">
    <!-- Flat Shadow (Fully rounded phone) -->
    <rect x="148" y="74" width="54" height="78" rx="12" fill="#E2E8F0"/>
    <!-- Phone Body (Floating tactile mobile device) -->
    <rect x="144" y="70" width="54" height="78" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <!-- Screen Viewport -->
    <rect x="150" y="78" width="42" height="58" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
    <!-- Top Notch Speaker -->
    <line x1="164" y1="74" x2="178" y2="74" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Dictionary App Interface in Phone -->
    <rect x="154" y="84" width="34" height="8" rx="2" fill="#4A90E2"/>
    <rect x="154" y="96" width="22" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="154" y="104" width="28" height="4" rx="2" fill="#CBD5E1"/>
    <!-- Bottom Verified Sync Mark -->
    <circle cx="171" cy="122" r="6" fill="#50E3C2" stroke="#0F172A" stroke-width="1.2"/>
    <path d="M 169 122 L 171 124 L 174 120" fill="none" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ========================================== -->
  <!-- 4. CENTRAL CLOUD TELEMETRY & SYNC BEAMS    -->
  <!-- ========================================== -->
  <g id="cloud-sync-hub">
    <!-- Hard Flat Shadow -->
    <path d="M 98 40 C 98 30 108 22 120 22 C 130 22 139 28 142 36 C 148 36 154 42 154 48 C 154 56 148 62 140 62 L 100 62 C 92 62 86 56 86 48 C 86 42 91 37 97 36" fill="#E2E8F0"/>
    
    <!-- Cloud Node Body -->
    <path d="M 94 36 C 94 26 104 18 116 18 C 126 18 135 24 138 32 C 144 32 150 38 150 44 C 150 52 144 58 136 58 L 96 58 C 88 58 82 52 82 44 C 82 38 87 33 93 32" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>

    <!-- Cloud Center Sync Icon (Rotating Dual Arrows) -->
    <path d="M 110 36 A 7 7 0 0 1 123 33 L 123 30 M 123 33 L 120 36" fill="none" stroke="#4A90E2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 122 40 A 7 7 0 0 1 109 43 L 109 46 M 109 43 L 112 40" fill="none" stroke="#50E3C2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sync Data Stream Waves (Between Tower, Cloud and Mobile) -->
  <g id="data-streams">
    <!-- Left to Cloud -->
    <path d="M 72 46 C 72 34 82 30 88 30" fill="none" stroke="#4A90E2" stroke-width="1.8" stroke-dasharray="3 3"/>
    <!-- Cloud to Phone -->
    <path d="M 144 44 C 160 48 168 60 168 70" fill="none" stroke="#50E3C2" stroke-width="1.8" stroke-dasharray="3 3"/>
  </g>
</svg>
