<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <!-- FM DICTIONARY ILLUSTRATION: Clean Operational Logbook (ill_empty_history.svg) -->
  <!-- Tactile Neo-Bento Standard: Clean Minimal Flat, 2.0px / 1.5px strokes, AppColors mapping -->

  <!-- ========================================== -->
  <!-- 2. PRISTINE OPERATIONAL LOGBOOK            -->
  <!-- ========================================== -->
  <!-- Hard Flat Shadow -->
  <rect x="54" y="36" width="134" height="112" rx="16" fill="#E2E8F0"/>

  <!-- Logbook Cover Body (Fully rounded pod body) -->
  <rect x="50" y="32" width="134" height="112" rx="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>

  <!-- Left Binding Spine (Primary Blue Brand Tone) -->
  <path d="M 50 46 C 50 38.27 56.27 32 64 32 L 74 32 L 74 144 L 64 144 C 56.27 144 50 137.73 50 130 Z" fill="#4A90E2" stroke="#0F172A" stroke-width="2"/>
  <line x1="62" y1="48" x2="62" y2="128" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="4 4"/>

  <!-- Clean Timestamp Column Rows inside Logbook -->
  <rect x="86" y="46" width="86" height="16" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <rect x="92" y="52" width="20" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="118" y="52" width="46" height="4" rx="2" fill="#E2E8F0"/>

  <rect x="86" y="68" width="86" height="16" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <rect x="92" y="74" width="20" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="118" y="74" width="38" height="4" rx="2" fill="#E2E8F0"/>

  <rect x="86" y="90" width="86" height="16" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <rect x="92" y="96" width="20" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="118" y="96" width="42" height="4" rx="2" fill="#E2E8F0"/>

  <!-- Clean Waiting State Dashed Slot -->
  <rect x="86" y="112" width="86" height="18" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- ========================================== -->
  <!-- 3. FOREGROUND: TELEMETRY CLOCK GAUGE       -->
  <!-- ========================================== -->
  <g id="telemetry-clock">
    <!-- Flat Shadow -->
    <circle cx="166" cy="116" r="22" fill="#334155" opacity="0.12"/>
    <!-- Clock Body (Streak Yellow Accent) -->
    <circle cx="164" cy="114" r="22" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <circle cx="164" cy="114" r="18" fill="#FFFBEB" stroke="#FDCB6E" stroke-width="1.5"/>

    <!-- Clock Center Pivot -->
    <circle cx="164" cy="114" r="2.5" fill="#0F172A"/>
    <!-- Clock Hands (Reset to 12:00 Clean Zero State) -->
    <line x1="164" y1="114" x2="164" y2="102" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
    <line x1="164" y1="114" x2="172" y2="114" stroke="#4A90E2" stroke-width="2" stroke-linecap="round"/>

    <!-- Perimeter Hour Marks -->
    <circle cx="164" cy="99" r="1" fill="#0F172A"/>
    <circle cx="179" cy="114" r="1" fill="#0F172A"/>
    <circle cx="164" cy="129" r="1" fill="#0F172A"/>
    <circle cx="149" cy="114" r="1" fill="#0F172A"/>
  </g>
</svg>
