<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <!-- FM DICTIONARY ILLUSTRATION: Level A2 - Basic Facility Operations (ill_level_a2.svg) -->
  <!-- Tactile Neo-Bento Standard: Clean Minimal Flat, 2.0px contour, AppColors mapping -->

  <!-- 1. BLUEPRINT BACKGROUND PLATE -->
  <rect x="46" y="22" width="154" height="142" rx="16" fill="#E2E8F0"/>
  <rect x="42" y="18" width="154" height="142" rx="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.0"/>

  <!-- Blueprint Coordinate Grid -->
  <line x1="56" y1="42" x2="182" y2="42" stroke="#0F172A" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="56" y1="134" x2="182" y2="134" stroke="#0F172A" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="68" y1="30" x2="68" y2="148" stroke="#0F172A" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="170" y1="30" x2="170" y2="148" stroke="#0F172A" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 4"/>

  <!-- Technical Corner Registration Marks -->
  <path d="M 50 26 L 56 26 M 50 26 L 50 32" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 188 26 L 182 26 M 188 26 L 188 32" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 2. OPERATIONS MOTIF: CHECKLIST BOARD & ADJUSTABLE MAINTENANCE WRENCH -->
  <!-- Routine Inspection Checklist Board (Left Background) -->
  <rect x="60" y="48" width="46" height="66" rx="6" fill="#CCFBF1" stroke="#0F172A" stroke-width="1.8"/>
  <rect x="74" y="44" width="18" height="8" rx="3" fill="#0D9488" stroke="#0F172A" stroke-width="1.4"/>
  <!-- Checklist Lines & Verified Checks -->
  <line x1="72" y1="64" x2="98" y2="64" stroke="#0F172A" stroke-width="1.2"/>
  <line x1="72" y1="78" x2="98" y2="78" stroke="#0F172A" stroke-width="1.2"/>
  <line x1="72" y1="92" x2="94" y2="92" stroke="#0F172A" stroke-width="1.2"/>
  <path d="M 64 63 L 67 66 L 71 61" stroke="#0D9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 64 77 L 67 80 L 71 75" stroke="#0D9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Maintenance Adjustable Wrench (Right Angled) -->
  <g transform="rotate(-30 156 86)">
    <!-- Wrench Handle -->
    <rect x="150" y="44" width="12" height="74" rx="4" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.8"/>
    <circle cx="156" cy="110" r="3.5" fill="#CCFBF1" stroke="#0F172A" stroke-width="1.2"/>
    <!-- Wrench Head -->
    <path d="M 144 46 C 144 32 168 32 168 46 L 164 54 L 148 54 Z" fill="#0D9488" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round"/>
    <rect x="150" y="34" width="12" height="10" rx="2" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/>
  </g>

  <!-- 3. CENTRAL A2 OPERATIONAL CREST -->
  <circle cx="120" cy="84" r="34" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.0"/>
  <circle cx="120" cy="84" r="28" fill="#0D9488" fill-opacity="0.15" stroke="#0D9488" stroke-width="1.5"/>

  <!-- Center A2 Hexagon Badge -->
  <path d="M 120 66 L 136 75 L 136 93 L 120 102 L 104 93 L 104 75 Z" fill="#0D9488" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Vector Stylized 'A2' -->
  <path d="M 111 91 L 115 77 L 119 91 M 112 87 L 118 87" stroke="#FFFFFF" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 123 80 C 123 76.5 129 76.5 129 80 C 129 84 123 86 123 91 L 130 91" stroke="#FFFFFF" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Two Operations Stars -->
  <path d="M 111 54 L 113 58 L 117 58.5 L 114 61.5 L 115 65.5 L 111 63 L 107 65.5 L 108 61.5 L 105 58.5 L 109 58 Z" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.0" stroke-linejoin="round"/>
  <path d="M 129 54 L 131 58 L 135 58.5 L 132 61.5 L 133 65.5 L 129 63 L 125 65.5 L 126 61.5 L 123 58.5 L 127 58 Z" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.0" stroke-linejoin="round"/>

  <!-- 4. LEVEL PROGRESS CALIBRATION POD (Node 1 & 2 Active) -->
  <rect x="74" y="136" width="92" height="16" rx="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.5"/>
  <circle cx="86" cy="144" r="3.5" fill="#0D9488" stroke="#0F172A" stroke-width="1.0"/>
  <circle cx="100" cy="144" r="3.5" fill="#0D9488" stroke="#0F172A" stroke-width="1.0"/>
  <circle cx="114" cy="144" r="3.0" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.8"/>
  <circle cx="126" cy="144" r="3.0" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.8"/>
  <circle cx="138" cy="144" r="3.0" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.8"/>
  <circle cx="152" cy="144" r="3.0" fill="#E2E8F0" stroke="#0F172A" stroke-width="0.8"/>
</svg>
