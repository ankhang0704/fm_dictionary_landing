<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <!-- FM DICTIONARY ILLUSTRATION: Engineering Cohort (ill_empty_group.svg) -->
  <!-- Tactile Neo-Bento Standard: Clean Minimal Flat, 2.0px / 1.5px strokes, AppColors mapping -->

  <!-- ========================================== -->
  <!-- 2. COLLABORATIVE BLUEPRINT WORKBENCH TABLE -->
  <!-- ========================================== -->
  <!-- Table Platform Flat Shadow (Fully rounded floating island) -->
  <rect x="44" y="96" width="152" height="52" rx="16" fill="#E2E8F0"/>

  <!-- Technical Workbench Surface (Clean rounded pod body) -->
  <rect x="40" y="92" width="152" height="52" rx="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>

  <!-- Rolled Facility Blueprint on Table -->
  <rect x="74" y="108" width="84" height="20" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/>
  <line x1="74" y1="118" x2="158" y2="118" stroke="#4A90E2" stroke-width="1.4" stroke-dasharray="3 3"/>
  <circle cx="158" cy="118" r="3.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/>

  <!-- Integrated Workbench Foot Base Pods (Enclosed tactile pads) -->
  <rect x="58" y="140" width="16" height="8" rx="4" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.6"/>
  <rect x="166" y="140" width="16" height="8" rx="4" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.6"/>

  <!-- ========================================== -->
  <!-- 3. COHORT ENGINEER SEATS & HARD HATS       -->
  <!-- ========================================== -->
  <!-- Left Engineer (Primary Blue Brand / Hardhat) -->
  <g id="engineer-left">
    <!-- Body Profile -->
    <path d="M 52 92 C 52 80 60 74 72 74 C 84 74 92 80 92 92 Z" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.8"/>
    <!-- Head Base -->
    <circle cx="72" cy="60" r="13" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Safety Hardhat (Primary Blue) -->
    <path d="M 60 59 C 60 51 65 48 72 48 C 79 48 84 51 84 59 Z" fill="#4A90E2" stroke="#0F172A" stroke-width="1.5"/>
    <line x1="57" y1="59" x2="87" y2="59" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right Engineer (Badge Purple / Hardhat) -->
  <g id="engineer-right">
    <!-- Body Profile -->
    <path d="M 148 92 C 148 80 156 74 168 74 C 180 74 188 80 188 92 Z" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.8"/>
    <!-- Head Base -->
    <circle cx="168" cy="60" r="13" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Safety Hardhat (Safety Amber) -->
    <path d="M 156 59 C 156 51 161 48 168 48 C 175 48 180 51 180 59 Z" fill="#F59E0B" stroke="#0F172A" stroke-width="1.5"/>
    <line x1="153" y1="59" x2="183" y2="59" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ========================================== -->
  <!-- 4. CENTER COLLABORATION LINK & EMPTY PIN   -->
  <!-- ========================================== -->
  <!-- Discussion Connecting Line / Bridge -->
  <path d="M 86 52 C 104 36 136 36 154 52" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="3 3"/>

  <!-- Empty Cohort Waiting Slot Badge in Center -->
  <g id="cohort-badge">
    <!-- Shadow -->
    <circle cx="122" cy="44" r="16" fill="#334155" opacity="0.12"/>
    <!-- Badge -->
    <circle cx="120" cy="42" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/>
    <!-- Plus Add Group Member Symbol (Streak Yellow) -->
    <line x1="120" y1="34" x2="120" y2="50" stroke="#FDCB6E" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="112" y1="42" x2="128" y2="42" stroke="#FDCB6E" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
