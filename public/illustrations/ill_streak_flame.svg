<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <!-- FM DICTIONARY ILLUSTRATION: Proud Streak Flame & Energy Torch (ill_streak_flame.svg) -->
  <!-- Tactile Neo-Bento Standard: Clean Minimal Flat, 2.0px contour, AppColors mapping -->

  <!-- ========================================== -->
  <!-- 1. AMBIENT BACKDROP & SPARKLE PARTICLES    -->
  <!-- ========================================== -->
  <!-- Soft Energy Aura Ring -->
  <circle cx="120" cy="82" r="56" fill="#FEF3C7" fill-opacity="0.45"/>

  <!-- Left Milestone Star -->
  <path d="M 46 46 L 50 54 L 58 58 L 50 62 L 46 70 L 42 62 L 34 58 L 42 54 Z" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right Energy Node -->
  <circle cx="192" cy="48" r="6" fill="#4A90E2" stroke="#0F172A" stroke-width="1.6"/>
  <circle cx="192" cy="48" r="2.2" fill="#FFFFFF"/>
  <!-- Secondary Orbit Embers -->
  <circle cx="184" cy="82" r="3.5" fill="#FF7643" stroke="#0F172A" stroke-width="1.4"/>
  <circle cx="56" cy="92" r="3.5" fill="#50E3C2" stroke="#0F172A" stroke-width="1.4"/>
  <circle cx="176" cy="112" r="2.5" fill="#50E3C2" stroke="#0F172A" stroke-width="1.2"/>

  <!-- ========================================== -->
  <!-- 2. THE PROUD FLAME (DRAWN BEHIND TORCH RIM)-->
  <!-- ========================================== -->
  <!-- Hard Neo-Brutalist Flame Offset Shadow -->
  <path d="M 126 16 C 142 36 168 58 166 88 C 164 108 148 118 124 118 C 100 118 82 106 82 84 C 82 66 94 52 96 42 C 96 52 104 54 108 46 C 112 34 118 24 126 16 Z" fill="#CBD5E1"/>

  <!-- Outer Flame Body (Vibrant Warm Orange-Gold) -->
  <path d="M 122 12 C 138 32 164 54 162 84 C 160 104 144 114 120 114 C 96 114 78 102 78 80 C 78 62 90 48 92 38 C 92 48 100 50 104 42 C 108 30 114 20 122 12 Z" fill="#FF8A4C" stroke="#0F172A" stroke-width="2.0" stroke-linejoin="round"/>

  <!-- Mid Flame Petal (AppColors.streakYellow #FDCB6E) -->
  <path d="M 122 34 C 134 50 148 66 148 84 C 148 100 136 110 120 110 C 104 110 94 100 94 84 C 94 70 106 52 122 34 Z" fill="#FDCB6E" stroke="#0F172A" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Core Flame Spark (Warm Bright Butter & White Highlight) -->
  <path d="M 120 58 C 128 70 134 80 134 90 C 134 100 128 106 120 106 C 112 106 106 100 106 90 C 106 80 112 70 120 58 Z" fill="#FEF3C7" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="120" cy="92" r="5" fill="#FFFFFF"/>

  <!-- ========================================== -->
  <!-- 3. MECHANICAL BEACON HOUSING (TORCH CUP)   -->
  <!-- ========================================== -->
  <!-- Torch Cup Upper Rim Collar -->
  <rect x="86" y="96" width="68" height="8" rx="4" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.0"/>
  <!-- Torch Cup Body (Now clearly visible with cooling vents!) -->
  <path d="M 84 128 L 92 104 L 148 104 L 156 128 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.0" stroke-linejoin="round"/>
  <!-- Cooling & Vent Ticks -->
  <line x1="108" y1="111" x2="108" y2="121" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="120" y1="111" x2="120" y2="121" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="132" y1="111" x2="132" y2="121" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- ========================================== -->
  <!-- 4. PEDESTAL & FACILITY TORCH BASE          -->
  <!-- ========================================== -->
  <!-- Pedestal Hard Flat Shadow -->
  <rect x="63" y="147" width="118" height="18" rx="9" fill="#CBD5E1"/>
  <!-- Center Telemetry Riser -->
  <rect x="90" y="126" width="60" height="18" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.0"/>
  <!-- Tech Band (primaryBlue) -->
  <rect x="98" y="131" width="44" height="8" rx="4" fill="#4A90E2" stroke="#0F172A" stroke-width="1.5"/>
  <!-- Primary Pedestal Base -->
  <rect x="58" y="142" width="124" height="20" rx="10" fill="#F1F5F9" stroke="#0F172A" stroke-width="2.0"/>
</svg>
